[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cotocoa"
version = "0.2.0"
description = "Named snapshot coupling for Fortran, C and Python"
requires-python = ">=3.10"
dependencies = ["numpy", "mpi4py", "PyYAML"]
license = {file = "LICENSE"}
readme = "README.md"

[project.scripts]
cotocoa = "cotocoa.cli:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
